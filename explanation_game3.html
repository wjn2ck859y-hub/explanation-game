<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>說明方法｜考試挑戰</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
body{
  font-family:"Microsoft JhengHei",sans-serif;
  background:#f3f4f6;
  max-width:900px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;}
.card{
  background:#fff;
  padding:24px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:1em;
}
button{
  border:none;
  border-radius:8px;
  background:#e5e7eb;
  cursor:pointer;
}
button:hover{background:#d1d5db;}
.timer,.score{
  text-align:center;
  font-weight:bold;
}
.timer{color:#b91c1c;}
#qrcode{display:flex;justify-content:center;margin:20px 0;}
</style>
</head>

<body>

<h1>📘 說明方法・考試挑戰</h1>
<div id="qrcode"></div>

<div class="card">
  <input id="studentId" placeholder="請輸入學生編號（如：5A12）">
  <div class="score">得分：<span id="score">0</span> / 14</div>
  <div class="timer">剩餘時間：<span id="timer">25</span> 秒</div>
  <div id="question"></div>
  <div id="choices"></div>
  <div id="result"></div>
</div>

<script>
// QR Code
new QRCode(document.getElementById("qrcode"), {
  text: window.location.href,
  width:160,
  height:160
});

// 題目（考試程度）
const questions = [
 {t:"所謂「能源危機」，是指社會在生產和生活中，因能源供應不足或分配失衡，而對經濟發展及民生造成影響的情況。",a:"定義"},
 {t:"友誼並非單靠一起玩樂建立，而是一種在人與人之間，透過互相信任、理解和支持而形成的穩定關係。",a:"定義"},

 {t:"為了培養良好的閱讀習慣，學生可以每天固定閱讀時間，或在課餘時翻閱課外書，這些做法都有助提升理解能力。",a:"舉例"},
 {t:"在校園生活中，有些行為能展現責任感，例如準時交功課、遵守校規，以及主動協助同學解決困難。",a:"舉例"},

 {t:"根據用途不同，塑膠製品大致可分為食品包裝用品、日常生活用品，以及工業用材料三類。",a:"分類"},
 {t:"書籍若按照內容性質區分，可分為文學作品、實用工具書和科普讀物，各類書籍的閱讀目的亦有所不同。",a:"分類"},

 {t:"一項研究指出，學生若每天使用電子產品超過三小時，出現專注力下降的機會會明顯增加。",a:"數字"},
 {t:"該校今年共有六個班別參與閱讀計劃，每班需完成最少五本指定書籍，方可達到計劃要求。",a:"數字"},

 {t:"與單靠死記課文內容相比，透過理解文章結構和中心思想來學習，學生往往能記得更牢，應用時也更靈活。",a:"比較"},
 {t:"相比以往需要翻閱大量資料，現今透過網上搜尋便能迅速取得資訊，但學生仍須學會分辨內容的真確性。",a:"比較"},

 {t:"有心理學家指出，適當的休息不但有助減輕壓力，亦能提升學習效率，對學生身心發展十分重要。",a:"引用"},
 {t:"根據環保團體的觀察，若市民能減少即棄用品的使用，將有助減輕堆填區的負擔。",a:"引用"},

 {t:"人生就像一場長跑，比的不是起步有多快，而是能否堅持到底，走完屬於自己的路。",a:"比喻"},
 {t:"知識好比一盞明燈，能在迷惘時為人指引方向，幫助我們作出正確的選擇。",a:"比喻"}
];

const options = ["定義","舉例","分類","數字","比較","引用","比喻"];

let index=0, score=0, timeLeft=25, timer, startTime, totalTime=0;

function shuffle(arr){
 for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
}

function startTimer(){
 timeLeft=25;
 startTime=Date.now();
 document.getElementById("timer").textContent=timeLeft;
 timer=setInterval(()=>{
  timeLeft--;
  document.getElementById("timer").textContent=timeLeft;
  if(timeLeft<=0){clearInterval(timer);next();}
 },1000);
}

function load(){
 const q=questions[index];
 document.getElementById("question").textContent=q.t;
 const c=document.getElementById("choices");
 c.innerHTML="";
 const ops=[...options]; shuffle(ops);
 ops.forEach(o=>{
  const b=document.createElement("button");
  b.textContent=o;
  b.onclick=()=>check(o);
  c.appendChild(b);
 });
 startTimer();
}

function check(ans){
 clearInterval(timer);
 totalTime+=Math.floor((Date.now()-startTime)/1000);
 if(ans===questions[index].a) score++;
 document.getElementById("score").textContent=score;
 next();
}

function next(){
 index++;
 if(index<questions.length) load();
 else finish();
}

function finish(){
 const sid=document.getElementById("studentId").value;
 if(!sid){alert("請先輸入學生編號");return;}
 document.getElementById("question").textContent="✅ 完成！";
 document.getElementById("choices").innerHTML="";
 document.getElementById("result").innerHTML=
 `得分：${score}/14<br>總時間：${totalTime} 秒<br><br>
 <button onclick="submit()">提交成績</button>`;
}

function submit(){
 const formURL="https://docs.google.com/forms/d/e/【貼上你的FormID】/formResponse";
 const data={
  "entry.111111":document.getElementById("studentId").value,
  "entry.222222":score,
  "entry.333333":totalTime
 };
 fetch(formURL,{method:"POST",mode:"no-cors",body:new URLSearchParams(data)});
 alert("成績已提交 ✅");
}

load();
</script>
</body>
</html>
